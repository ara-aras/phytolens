# PhytoLens — extraction and drug-likeness configuration
#
# Every number in this file is a claim. `rationale` is the answer when a judge
# asks "why 8.5?". Every report carries a `config_hash` so a result can be tied
# back to the exact version of these numbers that produced it.
#
# Change a threshold here, not in code.

version: 1

extraction:
  # Solvent decides which compounds a given preparation can plausibly pull out.
  # The window is calculated logP (Crippen) — a rough proxy for partitioning
  # into the solvent, not a measurement.
  solvents:
    ethanol:
      label: "ethanol (70%)"
      logp_min: -1.0
      logp_max: 8.5
      rationale: >
        Deliberately wide. A tighter window (-0.5..5.0, the common "drug-like"
        default) excludes all five boswellic acids in Boswellia serrata
        gum-resin (logP 6.27-7.66) — which is precisely the fraction a 70%
        ethanol Soxhlet extraction is used to obtain. Triterpenoid acids are
        genuinely that hydrophobic. The default was wrong about the chemistry,
        not the other way round.

    water:
      label: "water (decoction)"
      logp_min: -3.0
      logp_max: 1.5
      rationale: >
        Aqueous decoction carries sugars, glycosides, organic acids and small
        polar phenolics. It cannot carry triterpenoids, so boswellic acids
        are correctly excluded here — that is a real result, not a bug.

    hexane:
      label: "hexane"
      logp_min: 1.5
      logp_max: 10.0
      rationale: >
        Non-polar. Carries waxes, sterols and triterpenes; leaves glycosides
        and organic acids behind.

  # Hard ceiling, applied after the solvent window.
  mw_max: 700
  mw_max_rationale: >
    500 Da is Lipinski's number for oral synthetic drugs, and phytochemistry
    routinely violates it: 3,281 compounds in this corpus exceed 500 and 1,242
    exceed 700. A 700 ceiling keeps saponins and triterpenoid glycosides out
    while keeping every boswellic acid in (largest 512.7).

druglikeness:
  # These produce FLAGS ONLY. They never remove a compound.
  # On Boswellia a hard Lipinski cut removed exactly one compound (AKBA) and
  # did no useful work on the other 46 — pure downside, and it deleted the
  # most-studied active in the plant.
  lipinski:
    mw_max: 500
    logp_max: 5.0
    hbd_max: 5
    hba_max: 10
  veber:
    rotb_max: 10
    tpsa_max: 140

parts:
  # IMPPAT leaves 22% (43,190 / 195,862) of plant-part associations blank.
  # We surface those as the part "unspecified" rather than silently dropping
  # them, so coverage is reported honestly.
  allow_unspecified: true
